[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Git invokes its bundled POSIX shell on Windows and /bin/sh on macOS/Linux.
# The shell alias also forwards Cargo's appended ELF path to the script.
runner = ["git", "-c", "alias.daisy-flash=!sh tools/flash.sh", "daisy-flash"]

rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  # This is needed if your flash or ram addresses are not aligned to 0x10000 in memory.x
  # See https://github.com/rust-embedded/cortex-m-quickstart/pull/95
  "-C", "link-arg=--nmagic",
  # thumbv7em-none-eabihf assumes the M4's single-precision FPU. The M7 in the H750 has
  # FPv5-D16, so f64 is hardware rather than a soft-float call.
  "-C", "target-cpu=cortex-m7",
]

[build]
target = "thumbv7em-none-eabihf" # Cortex-M7F (STM32H750)
